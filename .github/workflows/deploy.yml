name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'bicepconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lz
  cancel-in-progress: false

env:
  AZURE_CORE_NO_COLOR: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Waits for approval. The OIDC token and the client ID
    # (an environment secret) exist only after you approve.
    environment: lz-lab
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy network (named after the commit)
        shell: bash
        run: |
          NAME="lz-${GITHUB_SHA::7}-run${GITHUB_RUN_NUMBER}"
          echo "Deployment name: $NAME"
          az deployment group create \
            --name "$NAME" \
            --resource-group rg-lz-connectivity \
            --parameters infra/network.bicepparam
          echo "Deployed commit ${GITHUB_SHA} as ${NAME}" >> "$GITHUB_STEP_SUMMARY"

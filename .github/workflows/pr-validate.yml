name: pr-validate

# Runs on every PR to main with no path filter, so the required
# checks always report. Uses the READ-ONLY identity.
on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AZURE_CORE_NO_COLOR: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and compile Bicep
        shell: bash
        run: |
          az bicep install
          for f in bootstrap/main.bicep infra/*.bicep; do
            echo "Linting $f"
            az bicep build --file "$f" --stdout > /dev/null
          done
          az bicep build-params --file bootstrap/main.bicepparam --stdout > /dev/null
          echo "Lint passed" >> "$GITHUB_STEP_SUMMARY"

  what-if:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WHATIF }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (read-only identity, changes nothing)
        shell: bash
        run: |
          az deployment group what-if \
            --name "pr-${{ github.event.pull_request.number }}" \
            --resource-group rg-lz-connectivity \
            --template-file infra/connectivity.bicep \
            --validation-level ProviderNoRbac | tee whatif.txt
          {
            echo "## What-if for PR #${{ github.event.pull_request.number }} (rg-lz-connectivity)"
            echo '```'
            cat whatif.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

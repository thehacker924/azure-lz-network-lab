name: pr-validate

# Runs on every PR to main with no path filter, so the required
# checks always report. Uses the READ-ONLY identity.
on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AZURE_CORE_NO_COLOR: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check rule files are valid JSON
        shell: bash
        run: |
          for f in network-policy/*.json; do
            echo "Checking $f"
            python3 -m json.tool "$f" > /dev/null
          done
      - name: Analyze NSG rules (duplicates, conflicts, shadowed, too open)
        shell: bash
        run: |
          # "|| true" lets us write the summary first; the last line decides pass/fail.
          python3 migration/analyze_rules.py network-policy > analysis.txt || true
          cat analysis.txt
          {
            echo "## NSG rule analysis"
            echo '```'
            cat analysis.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q "Result: 0 error(s)" analysis.txt
      - name: Lint and compile Bicep
        shell: bash
        run: |
          az bicep install
          for f in bootstrap/main.bicep infra/*.bicep; do
            echo "Linting $f"
            az bicep build --file "$f" --stdout > /dev/null
          done
          for p in bootstrap/main.bicepparam infra/*.bicepparam; do
            echo "Checking $p"
            az bicep build-params --file "$p" --stdout > /dev/null
          done
          echo "Lint passed" >> "$GITHUB_STEP_SUMMARY"

  what-if:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_WHATIF }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (read-only identity, changes nothing)
        shell: bash
        run: |
          az deployment group what-if \
            --name "pr-${{ github.event.pull_request.number }}" \
            --resource-group rg-lz-connectivity \
            --parameters infra/network.bicepparam \
            --validation-level ProviderNoRbac | tee whatif.txt
          {
            echo "## What-if for PR #${{ github.event.pull_request.number }}"
            echo '```'
            cat whatif.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE '[1-9][0-9]* to delete' whatif.txt; then
            echo "::warning title=What-if shows deletions::This PR would delete resources. Read the what-if summary before merging."
          fi

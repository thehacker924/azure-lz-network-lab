name: pr-validate

# Runs on every PR to main with no path filter, so the required
# checks always report (a filter would leave docs-only PRs stuck).
on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AZURE_CORE_NO_COLOR: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and compile Bicep
        shell: bash
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
          echo "Lint passed" >> "$GITHUB_STEP_SUMMARY"

  what-if:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (preview only, changes nothing)
        shell: bash
        run: |
          az deployment sub what-if \
            --name "pr-${{ github.event.pull_request.number }}" \
            --location eastus2 \
            --parameters infra/main.bicepparam | tee whatif.txt
          {
            echo "## What-if for PR #${{ github.event.pull_request.number }}"
            echo '```'
            cat whatif.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
